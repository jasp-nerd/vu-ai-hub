<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00609A" />
    </linearGradient>
    <linearGradient id="secondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <g transform="translate(128, 128)">
    <!-- Base Neural Lines -->
    <path d="M 40 40 L 128 170 M 216 40 L 128 170" stroke="#004675" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
    
    <!-- Glowing Network Paths -->
    <path d="M 40 40 L 128 170 L 216 40 L 170 216 L 86 216 Z" stroke="url(#primary)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.6" />
    <path d="M 40 40 L 128 170 L 216 40" stroke="url(#secondary)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
    
    <!-- Central Beam -->
    <path d="M 128 170 L 128 240 M 40 40 L 128 90 L 216 40" stroke="url(#primary)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Intersecting Brain-like Synapses -->
    <path d="M 70 85 L 186 85 M 95 125 L 161 125" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5" />

    <!-- Nodes -->
    <circle cx="40" cy="40" r="16" fill="#080c16" stroke="#38BDF8" stroke-width="6" />
    <circle cx="216" cy="40" r="16" fill="#080c16" stroke="#38BDF8" stroke-width="6" />
    <circle cx="128" cy="170" r="20" fill="#080c16" stroke="#7DD3FC" stroke-width="8" filter="url(#glow)" />
    <circle cx="128" cy="240" r="12" fill="#080c16" stroke="#0EA5E9" stroke-width="6" />
    <circle cx="86" cy="216" r="10" fill="#080c16" stroke="#00609A" stroke-width="5" />
    <circle cx="170" cy="216" r="10" fill="#080c16" stroke="#00609A" stroke-width="5" />
    
    <!-- Small synapse dots -->
    <circle cx="70" cy="85" r="5" fill="#38BDF8" />
    <circle cx="186" cy="85" r="5" fill="#38BDF8" />
    <circle cx="95" cy="125" r="4" fill="#38BDF8" />
    <circle cx="161" cy="125" r="4" fill="#38BDF8" />
    <circle cx="128" cy="90" r="5" fill="#7DD3FC" filter="url(#glow)"/>
  </g>
</svg>
