<?xml version="1.0" encoding="UTF-8"?>
<svg xml:lang="en" version="1.1"
  width="800px" height="159.5px" viewBox="0 0 361 72"
  xmlns="http://www.w3.org/2000/svg"
>
<title>Basic RDF Graph</title>

<desc>Image of the RDF triple comprising (subject, predicate, object).</desc>

<metadata>
<rdf:RDF
  xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
  xmlns:dc="http://purl.org/dc/elements/1.1/"
>
	<rdf:Description rdf:about="">
		<dc:title xml:lang="en">Basic RDF Graph</dc:title>
		<dc:creator rdf:resource="https://meta.wikimedia.org/?curid=10484470"/>
		<dc:subject rdf:datatype="http://ndl.go.jp/dcndl/terms/NIISubject">情報学</dc:subject>
		<dc:description xml:lang="en">Image of the RDF triple comprising (subject, predicate, object).</dc:description>
		<dc:contributor rdf:resource="https://www.w3.org"/>
		<dc:date rdf:datatype="http://www.w3.org/2001/XMLSchemadate">2019-09-12</dc:date>
		<dc:type rdf:datatype="http://purl.org/dc/terms/DCMIType">StillImage</dc:type>
		<dc:format rdf:datatype="http://purl.org/dc/terms/IMT">image/svg+xml</dc:format>
		<dc:source rdf:resource="https://www.w3.org/TR/rdf-concepts/Graph-ex.gif"/>
		<dc:language rdf:datatype="http://purl.org/dc/terms/ISO639-2">eng</dc:language>
		<dc:rights rdf:resource="http://www.wtfpl.net/about/"/>
	</rdf:Description>
</rdf:RDF>
</metadata>

<!--
<rect
  width="100%" height="100%"
  fill="none" stroke="blue"
/>
-->

<g
  transform="scale(0.8) translate(36.1,7.2)"
  fill="black"
  font-size="18" font-family="DejaVu Sans"
  text-anchor="middle"
>
<g>

	<title>Subject</title>
	<ellipse
	  fill="white" stroke="black"
	  cx="54" cy="36" rx="54" ry="36"
	/>
	<text
	  x="54" y="40"
	>Subject</text>
</g>

<g>
	<title>Predicate</title>
	<line
	  stroke="gray" stroke-width="2"
	  x1="109" y1="36" x2="249" y2="36"
	/>
	<polyline
	  fill="none" stroke="gray" stroke-width="2"
	  points="232,27 249,36 232,45"
	/>
	<text
	  x="179" y="27"
	>Predicate</text>
</g>

<g
  transform="translate(252,0)"
>
	<title>Object</title>
	<ellipse
	  fill="white" stroke="black"
	  cx="54" cy="36" rx="54" ry="36"
	/>
	<text
	  x="54" y="40"
	>Object</text>
</g>

