<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Before Conditioning -->
    <text x="200" y="30" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#64748b" font-size="14">Before Conditioning</text>
    <rect x="50" y="50" width="100" height="40" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    <text x="100" y="75" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Food (US)</text>
    
    <line x1="160" y1="70" x2="240" y2="70" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow-cc)"/>
    
    <rect x="250" y="50" width="100" height="40" rx="8" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
    <text x="300" y="75" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Salivate (UR)</text>
    
    <!-- During Conditioning -->
    <text x="200" y="130" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#64748b" font-size="14">During Conditioning</text>
    <rect x="20" y="150" width="80" height="40" rx="8" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    <text x="60" y="175" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Bell (NS)</text>
    
    <text x="120" y="175" text-anchor="middle" font-weight="bold" fill="#94a3b8" font-family="sans-serif" font-size="20">+</text>
    
    <rect x="140" y="150" width="80" height="40" rx="8" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    <text x="180" y="175" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Food</text>
    
    <line x1="230" y1="170" x2="270" y2="170" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow-cc)"/>
    
    <rect x="280" y="150" width="100" height="40" rx="8" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
    <text x="330" y="175" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Salivate (UR)</text>

    <!-- After Conditioning -->
    <text x="200" y="230" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#64748b" font-size="14">After Conditioning</text>
    <rect x="50" y="250" width="100" height="40" rx="8" fill="#10b981" stroke="#059669" stroke-width="2"/>
    <text x="100" y="275" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Bell (CS)</text>
    
    <line x1="160" y1="270" x2="240" y2="270" stroke="#cbd5e1" stroke-width="4" marker-end="url(#arrow-cc)"/>
    
    <rect x="250" y="250" width="100" height="40" rx="8" fill="#8b5cf6" stroke="#6d28d9" stroke-width="2"/>
    <text x="300" y="275" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Salivate (CR)</text>

    <defs>
        <marker id="arrow-cc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#cbd5e1" />
        </marker>
    </defs>
</svg>
