<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Brain shape (rough side view) -->
    <!-- Frontal Lobe (Blue) -->
    <path d="M 80 150 C 40 100, 60 40, 150 40 C 180 40, 200 60, 210 100 C 200 140, 150 160, 80 150 Z" fill="#3b82f6" stroke="#2563eb" stroke-width="2"/>
    
    <!-- Parietal Lobe (Yellow) -->
    <path d="M 150 40 C 250 10, 300 40, 310 90 C 310 120, 250 140, 210 100 C 200 60, 180 40, 150 40 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
    
    <!-- Occipital Lobe (Red) -->
    <path d="M 310 90 C 340 110, 340 160, 310 180 C 280 190, 240 160, 230 130 C 250 140, 310 120, 310 90 Z" fill="#ef4444" stroke="#dc2626" stroke-width="2"/>
    
    <!-- Temporal Lobe (Green) -->
    <path d="M 80 150 C 150 160, 200 140, 210 100 C 210 100, 230 130, 240 160 C 250 200, 180 230, 120 200 C 90 180, 80 150, 80 150 Z" fill="#10b981" stroke="#059669" stroke-width="2"/>
    
    <!-- Brain Stem & Cerebellum (Gray) -->
    <path d="M 220 180 C 240 210, 280 230, 300 200 C 320 180, 280 150, 240 160 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 180 220 L 190 280 L 220 280 L 220 200 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>

    <!-- Labels -->
    <text x="120" y="100" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Frontal</text>
    <text x="240" y="70" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Parietal</text>
    <text x="160" y="170" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Temporal</text>
    <text x="300" y="130" text-anchor="middle" font-weight="bold" fill="white" font-family="sans-serif">Occipital</text>
</svg>
